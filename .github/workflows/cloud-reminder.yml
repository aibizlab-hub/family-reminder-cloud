name: Cloud Reminder Bot (CallMeBot · 24/7 唔使開電腦)

# ⚙️ GitHub 原生定時 — 完全唔使外部觸發、唔使開住部電腦
#
# 驅動方式（2026-10-11 終極加固 · v3）：
#   ✅ 唯一 24/7 驅動 = self-perpetuate re-arm loop（尾段 `gh workflow run`
#     自己起重啟，每 ~5 分鐘一粒）。經實測：原生 schedule 喺呢個 repo 已死
#     （最後一次 schedule run 係 2026-10-11T01:07，之後零觸發），靠 re-arm 先有 WhatsApp 發送。
#   ✅ 即時／手動觸發：repository_dispatch type=cloud-reminder-tick（API 即時重發）／
#     workflow_dispatch（GitHub UI Run workflow）。
#   ❌ 唔用 on: push（改 data.json 會引爆 + re-arm 撞 concurrency → cancelled）。
#   ❌ 唔用原生 schedule（已死；復活會同 re-arm 撞 → cancelled）。
#   ❌ 唔被 web-push 跨流程 launch（已拆開，各自獨立 re-arm，消除雙 driver 互撞 cancelled）。
#
# 點解唔會再出 cancelled run：單 driver（re-arm），每次 run 完成先 dispatch 下一粒，
# 永遠唔會有 2 個 run 同時入 concurrency group → 零碰撞 → 零 cancelled。
#
# concurrency group 必須留（唔可以拆）：確保同一時間只有 1 個 run 改 data.json /
# notifyLedger，避免 sync-data 同 bot 並行 → SHA 衝突 → 去重標記流失 → 同一提醒重複發送
# （舊 bug 實測 15 次）。
# ════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:        # 手動 test：GitHub → Actions → 此 workflow → Run workflow
  repository_dispatch:
    types: [cloud-reminder-tick]  # API 即時重發

permissions:
  contents: write          # sync-data.js 需要寫回 data.json / notifyLedger
  actions: write           # re-arm 用：gh workflow run 自己起重啟

concurrency:
  group: cloud-reminder
  cancel-in-progress: false   # 排隊唔 cancel：串行化改 data.json，去重跨 run 持久化，絕不雙發

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'   # Node 22 有 global fetch — 唔使 baileys / wacli
      - name: Sync cloud data (reconcile data.json ↔ jsonblob)
        # 修復 (P1)：先對賬 repo data.json 同 jsonblob (bot 雲端源)，確保 bot 讀到最新提醒；
        # sync-data.js 雙向合併 + 防 wipe，唔會抹走任何一邊。JSONBLOB_ID 未 set 會用內建預設值。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JSONBLOB_ID:  ${{ secrets.JSONBLOB_ID }}
        run: node sync-data.js
      - name: Run cloud reminder bot (CallMeBot WhatsApp)
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          DATA_URL:         https://jsonblob.com/api/jsonBlob/019fbcb0-45fe-7396-8713-75286c4be862
          CALLMEBOT_KEN:     ${{ secrets.CALLMEBOT_KEN }}
          CALLMEBOT_EPPIE:   ${{ secrets.CALLMEBOT_EPPIE }}
          CALLMEBOT_KENNY:   ${{ secrets.CALLMEBOT_KENNY }}
          CALLMEBOT_ROSANNA: ${{ secrets.CALLMEBOT_ROSANNA }}
          CALLMEBOT_COFFE:   ${{ secrets.CALLMEBOT_COFFE }}
          CALLMEBOT_LODOU:   ${{ secrets.CALLMEBOT_LODOU }}
        run: node cloud-reminder-bot.js
      # ★ self-perpetuate：run 完成先 dispatch 下一粒（單 driver，唔會撞 concurrency）
      - name: Re-arm timer (self-perpetuate ~5min cadence)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: aibizlab-hub/family-reminder-cloud
        run: |
          echo "⏳ Self-perpetuating WhatsApp bot (sleep ~285s before re-arm)…"
          sleep 285
          for i in 1 2 3 4 5; do
            if gh workflow run cloud-reminder.yml --ref "${{ github.ref_name }}"; then
              echo "✅ Re-armed cloud-reminder (attempt $i)"
              exit 0
            fi
            echo "⚠️ Re-arm attempt $i failed, retry in $((i*10))s…"
            sleep $((i*10))
          done
          echo "::error::Failed to re-arm cloud-reminder after 5 retries"
          exit 1
      # 覆蓋：① 提早 1 日 (09:00 HKT) ② 提早 3 小時 ③ 準時 ④ 每日 07:00 HKT 日程 digest
      # 全部經 CallMeBot 雲端 WhatsApp 發送，唔使 wacli / baileys / 掃 QR
