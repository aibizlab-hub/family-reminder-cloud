name: Web Push Reminder

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min, 24/7; timer may be disabled by GitHub — see repository_dispatch fallback
  workflow_dispatch:
  repository_dispatch:
    types: [web-push-tick]
  push:
    branches: [master]   # push 重啟 loop（備用，方便修復後即時恢復）

permissions:
  contents: write
  actions: write   # required so this run can re-arm the next run via gh workflow run

concurrency:
  group: web-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install web-push
      - name: Send due reminders via Web Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: aibizlab-hub/family-reminder-cloud
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: node web-push-send.js
      # ★ 修復 (2026-08-05)：原生 schedule cron 唔可靠（過去 8 鐘只成功跑 2 次），
      #   所以將 WhatsApp bot 掛喺呢條穩定嘅 5 分鐘 self-perpetuate loop 入面，
      #   每次 web-push 跑就順手 launch cloud-reminder.yml，令 WhatsApp 提醒 24/7 可靠發送。
      - name: Trigger Cloud Reminder Bot (WhatsApp / CallMeBot)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: aibizlab-hub/family-reminder-cloud
        run: |
          echo "📲 Triggering WhatsApp reminder bot (CallMeBot)…"
          gh workflow run cloud-reminder.yml --ref "${{ github.ref_name }}" || echo "::warning::Failed to trigger cloud-reminder (will retry next cycle)"
      - name: Re-arm timer (self-perpetuate next run, ~5 min cadence)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: aibizlab-hub/family-reminder-cloud
        run: |
          # Keep cadence ~5 min: sleep most of the interval so a runner isn't
          # churning every few seconds (avoids WhatsApp/npm thrash + API rate limit).
          # Cost is fixed at ~43.2k min/month either way (a runner is always active);
          # the sleep just sets the reminder check granularity.
          echo "⏳ Sleeping ~4m15s before re-arming (target 5-min cadence)…"
          sleep 255
          for i in 1 2 3 4 5; do
            if gh workflow run web-push.yml --ref "${{ github.ref_name }}"; then
              echo "✅ Re-armed web-push timer (attempt $i)"
              exit 0
            fi
            echo "⚠️ Re-arm attempt $i failed, retrying in $((i*10))s..."
            sleep $((i*10))
          done
          echo "::error::Failed to re-arm web-push timer after 3 retries"
          exit 1
