name: Web Push Reminder

# ════════════════════════════════════════════════════════════════
# Web Push 發送（家庭提醒通知）
#
# 驅動方式（2026-11-26 修復 · v4）：
#   ✅ 唯一 24/7 驅動 = GitHub 原生 schedule（每 5 分鐘一粒）。
#      背景：舊版 re-arm loop 11-05 被 cancelled 後永久中斷。
#      backup.yml / health-monitor.yml 嘅 native schedule 一直正常，所以改用原生 schedule。
#   ✅ 即時／手動觸發：repository_dispatch type=web-push-tick（前端或 API 即時重發）／
#     workflow_dispatch（GitHub UI Run workflow）。
#   ❌ 唔用 on: push（每次改 data.json 會引爆 → 撞 concurrency）。
#   concurrency group 照留：排隊唔 cancel，串行化，防止重複 push。
# ════════════════════════════════════════════════════════════════

# ⚠️ 2026-11-26：24/7 自動驅動已搬去 bot-driver.yml（呢個 workflow ID 被 GitHub 高頻節流）。
# 呢個檔只保留手動／API 觸發做測試用，唔再有 schedule / re-arm。
on:
  workflow_dispatch:        # 手動：GitHub → Actions → 此 workflow → Run workflow
  repository_dispatch:
    types: [web-push-tick]  # 前端／API 即時重發

permissions:
  contents: read

concurrency:
  group: web-push
  cancel-in-progress: false   # 排隊唔 cancel：安全序列化，防止重複 push

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install web-push
      - name: Send due reminders via Web Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: aibizlab-hub/family-reminder-cloud
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: node web-push-send.js
      # 24/7 驅動而家靠上面 on: schedule（每 5 分鐘），唔再靠 re-arm
