name: Web Push Reminder

# ════════════════════════════════════════════════════════════════
# Web Push 發送（家庭提醒通知）
#
# 驅動方式（2026-10-11 終極加固）：
#   ✅ 唯一驅動 = GitHub 原生 schedule（cron 每 5 分鐘）。
#      —— 經實測：default_branch = master，schedule 過去 100 次全部有觸發，
#         原生 schedule 係可靠嘅，根本唔需要 self-perpetuate re-arm loop。
#   ✅ 手動／即時觸發：workflow_dispatch（GitHub UI Run workflow）／
#      repository_dispatch type=web-push-tick（前端可即時重發）。
#
# 🔧 移除咗嘅嘢（呢啲先係 GitHub 報紅 ✗「cancelled」嘅真兇）：
#   1. self-perpetuate re-arm loop（尾段 sleep + gh workflow run 自己起重啟）
#      → re-arm 產生嘅 workflow_dispatch run 同原生 schedule run 擠入
#        同一個 concurrency group，GitHub 會 cancel 排隊緊嗰個 → 紅 ✗。
#   2. web-push 入面「Trigger Cloud Reminder Bot」跨流程觸發
#      → 同一時間有 web-push + cloud-reminder 兩條 loop 互相 launch，
#        雙重 concurrency 碰撞。Cloud Reminder 而家自己獨立 schedule 跑。
#
# 現時：只有 schedule（＋偶發手動 dispatch）進入 concurrency group，
# 每次 run 幾秒搞掂，5 分鐘間隔內必完成 → 零重疊 → 零 cancelled run。
# concurrency group 保留：萬一某次 run 超過 5 分鐘，下一個會排隊唔會
# 並行雙發（防止同一提醒重複 push）。
# ════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '*/5 * * * *'   # 原生 24/7 驅動（證實可靠），5 分鐘一粒
  workflow_dispatch:        # 手動測試：GitHub → Actions → 此 workflow → Run workflow
  repository_dispatch:
    types: [web-push-tick]  # 前端即時重發觸發

permissions:
  contents: read
  actions: read

concurrency:
  group: web-push
  cancel-in-progress: false   # 排隊唔 cancel：安全序列化，防止重複 push

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install web-push
      - name: Send due reminders via Web Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: aibizlab-hub/family-reminder-cloud
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: node web-push-send.js
